name: PHP SDK checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - name: Validate composer package
        run: composer validate --strict --no-check-publish
      - name: Check PHP source syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Smoke check
        run: php tests/smoke.php
